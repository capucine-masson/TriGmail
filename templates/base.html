<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#new" aria-label="Accueil : nouveau dossier">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">TriMail</span>
    </a>
    <nav class="tabs">
      <a href="#folders" data-view="folders">Mes dossiers</a>
      <a href="#chat" data-view="chat">Chat</a>
    </nav>
  </header>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
